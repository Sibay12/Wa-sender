<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Auto Sender</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;background:#f5f6f7;color:#111}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0002}
  h1{font-size:20px} h2{font-size:16px;margin:0 0 10px}
  textarea{width:100%;min-height:130px;padding:8px;font:inherit;box-sizing:border-box}
  button{background:#16a34a;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:15px;cursor:pointer}
  button.stop{background:#dc2626} button:disabled{opacity:.5}
  .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px}
  .ok{background:#dcfce7;color:#166534}.wait{background:#fef9c3;color:#854d0e}.bad{background:#fee2e2;color:#991b1b}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
  .scroll{overflow-x:auto;max-height:340px;overflow-y:auto}
  small{color:#666}
</style>
</head>
<body>
<h1>WhatsApp Auto Sender</h1>

<div class="card" id="conn"><h2>1. WhatsApp कनेक्शन</h2><div id="connBody">लोड हो रहा है...</div></div>

<div class="card">
  <h2>2. Excel + मैसेज</h2>
  <input type="file" id="file" accept=".xlsx,.xls,.csv"><br><br>
  <textarea id="tpl">Hello {business_name} team, I saw your business on Google and noticed your {rating} rating. I could not find a website for you. I build simple websites with WhatsApp booking and Google Maps for small businesses, ready in 2 days, starting at ₹3,000. Can I send you a quick sample?</textarea>
  <small>Excel के कॉलम: <b>Business Name</b>, <b>Mobile Number</b>, और अगर मैसेज में {rating} है तो <b>Rating</b>। कोई भी कॉलम {column_name} लिखकर मैसेज में डाल सकते हैं।</small><br><br>
  <button id="go">भेजना शुरू करें</button>
  <button class="stop" id="stop">रोकें</button>
  <div id="msg"></div>
</div>

<div class="card">
  <h2>3. स्टेटस <span id="counts"></span></h2>
  <div class="scroll"><table><thead><tr><th>Business</th><th>Number</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
async function poll(){
  try{
    const d = await (await fetch('/api/status')).json();
    const w = d.wa;
    if(w.status==='ready') $('connBody').innerHTML='<span class="badge ok">कनेक्टेड ✓</span>';
    else if(w.status==='qr') $('connBody').innerHTML='WhatsApp &rarr; Linked Devices &rarr; Link a device से स्कैन करें:<br><img src="'+w.qr+'" width="240">';
    else $('connBody').innerHTML='<span class="badge wait">'+w.status+'...</span>';
    const c=d.counts;
    $('counts').textContent=`(भेजे: ${c.sent} | फेल: ${c.failed} | बाकी: ${c.pending})`;
    $('rows').innerHTML=d.rows.map(r=>{
      const cls=r.status==='sent'?'ok':r.status==='failed'?'bad':'wait';
      const t=r.status==='sent'?'भेजा गया':r.status==='failed'?('फेल: '+r.error):'इंतज़ार में';
      return `<tr><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td><span class="badge ${cls}">${esc(t)}</span></td></tr>`;
    }).join('');
    $('go').disabled=d.running;
  }catch(e){}
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
$('go').onclick=async()=>{
  const f=$('file').files[0];
  if(!f){$('msg').textContent='पहले Excel चुनिए';return;}
  const fd=new FormData(); fd.append('file',f); fd.append('template',$('tpl').value);
  const r=await fetch('/api/upload',{method:'POST',body:fd}); const j=await r.json();
  $('msg').textContent=j.error?('⚠ '+j.error):('शुरू हो गया: '+j.total+' नंबर');
  poll();
};
$('stop').onclick=()=>fetch('/api/stop',{method:'POST'});
setInterval(poll,2000); poll();
</script>
</body>
</html>
