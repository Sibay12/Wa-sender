<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · WA Sender</title>
<style>
:root{--card:#fff;--tx:#0f1f17;--mut:#64748b;--bd:#d9e2dc}
@media(prefers-color-scheme:dark){:root{--card:#13211a;--tx:#e8f3ec;--mut:#8aa396;--bd:#223529}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--tx);background:linear-gradient(135deg,#0f7a37,#16a34a 55%,#34d399)}
.card{width:100%;max-width:380px;background:var(--card);border-radius:18px;padding:28px 24px;box-shadow:0 20px 50px #0004}
.logo{width:54px;height:54px;border-radius:14px;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 12px}
h1{font-size:22px;margin:0;text-align:center}p{color:var(--mut);text-align:center;margin:4px 0 20px;font-size:14px}
label{font-size:13px;font-weight:600;display:block;margin:12px 0 5px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:transparent;color:inherit}
input:focus{outline:2px solid #16a34a;border-color:transparent}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--mut);padding:6px 8px;cursor:pointer;font-size:13px}
.go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.go:disabled{opacity:.6}#err{color:#dc2626;font-size:14px;margin-top:12px;text-align:center;min-height:18px}
</style></head><body>
<div class="card">
  <div class="logo">💬</div><h1>WA Sender</h1><p>Sign in to continue</p>
  <label for="u">Username</label><input id="u" autocomplete="username" autofocus>
  <label for="p">Password</label>
  <div class="pw"><input id="p" type="password" autocomplete="current-password"><button type="button" id="t">Show</button></div>
  <button class="go" id="go">Sign in</button><div id="err"></div>
</div>
<script>
const $=id=>document.getElementById(id);
$('t').onclick=()=>{const s=$('p').type==='password';$('p').type=s?'text':'password';$('t').textContent=s?'Hide':'Show'};
async function login(){
  $('go').disabled=true;$('err').textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});
    const j=await r.json();
    if(j.ok)location='/';else $('err').textContent=j.error||'Login failed.';
  }catch(e){$('err').textContent='Network error. Try again.'}
  $('go').disabled=false;
}
$('go').onclick=login;
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
